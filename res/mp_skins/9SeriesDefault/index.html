<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WMP Skin - Unified Background</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="mp_9SeriesDefault_player">
  
  <button id="mp_9SeriesDefault_btn-min" class="mp_9SeriesDefault_btn-win" title="Minimize" onclick="parent.handleWindow('.music', 'min')"></button>
  <button id="mp_9SeriesDefault_btn-close" class="mp_9SeriesDefault_btn-win" title="Close" onclick="stopAudio(); parent.handleWindow('.music', 'close')"></button>

  <div id="mp_9SeriesDefault_screen" class="mp-ui-screen">
    <!-- inject songs here -->
  </div>

  <div id="mp_9SeriesDefault_status-bar">
    <span class="mp_9SeriesDefault_status-text mp-ui-status-text">Ready</span>
    <span class="mp_9SeriesDefault_status-time mp-ui-status-time">00:00</span>
  </div>

  <div id="mp_9SeriesDefault_seek-wrapper" class="mp_9SeriesDefault_slider-container">
    <div id="mp_9SeriesDefault_seek-fill" class="mp_9SeriesDefault_slider-fill mp-ui-seek-fill"></div>
    <input type="range" id="mp_9SeriesDefault_seek-bar" class="mp-ui-seek-bar" min="0" max="100" value="0" oninput="seekAudio(this.value)">
  </div>

  <button id="mp_9SeriesDefault_btn-rew" onclick="rewindAudio()"></button>
  <button id="mp_9SeriesDefault_btn-ffwd" onclick="ffwdAudio()"></button>

  <div class="mp_9SeriesDefault_transports-group">
    <button id="mp_9SeriesDefault_btn-play" class="mp_9SeriesDefault_btn-t" title="Play" onclick="togglePlay()"></button>
    <button id="mp_9SeriesDefault_btn-stop" class="mp_9SeriesDefault_btn-t" title="Stop" onclick="stopAudio()"></button>
    <button id="mp_9SeriesDefault_btn-prev" class="mp_9SeriesDefault_btn-t" title="Previous" onclick="prevTrack()"></button>
    <button id="mp_9SeriesDefault_btn-next" class="mp_9SeriesDefault_btn-t" title="Next" onclick="nextTrack()"></button>
    <button id="mp_9SeriesDefault_btn-mute" class="mp_9SeriesDefault_btn-t" title="Mute" onclick="toggleMute()"></button>
  </div>

  <div id="mp_9SeriesDefault_volume-wrapper" class="mp_9SeriesDefault_slider-container">
    <div id="mp_9SeriesDefault_volume-fill" class="mp_9SeriesDefault_slider-fill mp-ui-volume-fill"></div>
    <input type="range" id="mp_9SeriesDefault_volume-bar" class="mp-ui-volume-bar" min="0" max="100" value="50" oninput="changeVolume(this.value)">
  </div>

</div>

<script src="../../../js/mp-app.js"></script>

</body>
</html>
