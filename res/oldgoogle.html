<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            margin-top: 30px;
        }
        .logo {
            margin-bottom: 20px;
        }
        .search-box {
            background-color: #dfdfdf;
            padding: 15px;
            border-bottom: 1px solid #000000;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 350px;
            padding: 2px;
            margin-bottom: 10px;
        }
        .buttons {
            display: flex;
            gap: 5px;
            justify-content: center;
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #666;
        }
        a {
            color: #0000cc;
        }
    </style>
    <script>
        function performSearch() {
            var q = document.getElementById('searchQuery').value;
            if(q.trim() !== '') {
                window.location.href = 'https://www.google.com/search?igu=1&q=' + encodeURIComponent(q);
            }
        }
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Google_logo_%281998-1999%29.svg/1920px-Google_logo_%281998-1999%29.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail&_=20260526015006" alt="Google" width="280">
        </div>
        
        <div class="search-box">
            <label style="font-size: 13px; font-weight: bold;">Search the web using Google!</label><br><br>
            <input type="text" id="searchQuery" onkeypress="handleKeyPress(event)"><br>
            <div class="buttons">
                <button onclick="performSearch()">Google Search</button>
                <button onclick="performSearch()">I'm feeling lucky</button>
            </div>
        </div>

        <div style="font-size: 13px;">
            <a href="#">Help!</a> | <a href="#">About Google!</a> | <a href="#">Company Info</a> | <a href="#">Google! Logos</a>
        </div>
    </div>
    
    <div class="footer">
        Copyright ©1998 Google Inc.
    </div>
</body>
</html>
